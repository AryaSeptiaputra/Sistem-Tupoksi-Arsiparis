<div class="header-page">
    <div class="header-title">
        <h1>Profil Pengguna</h1>
        <p>Kelola informasi akun Anda</p>
    </div>
    <div class="header-tools">
        <div class="user-avatar" id="header-avatar-page">?</div>
    </div>
</div>

<div style="display: grid; grid-template-columns: 320px 1fr; gap: 24px;">

    <div class="content-card" style="text-align:center; padding:32px; border-radius:18px;">
        <div style="
            width:120px; height:120px; border-radius:60px; 
            background:var(--primary); margin: 0 auto 20px; 
            display:flex; align-items:center; justify-content:center; 
            color:white; font-size:42px; font-weight:600;
            box-shadow: 0 10px 25px rgba(255, 138, 92, 0.4);
        " id="profile-avatar-big">
            -
        </div>

        <h2 style="font-size:20px; font-weight:600;" id="display-username">Loading...</h2>

        <p style="margin-top:6px; color:var(--text-muted); font-size:14px;" id="display-nuptk">
            NUPTK: -
        </p>

        <div style="margin:16px 0;">
            <span id="display-role" class="role-badge">Loading..</span>
        </div>

        <div style="margin-top:6px; font-size:14px;">
            <span id="status-indicator" class="status-dot"></span>
            <span id="display-status-text" class="status-text">-</span>
        </div>

        <p style="margin-top:20px; color:var(--text-muted); font-size:13px;">
            📅 Bergabung: <span id="display-joined">-</span>
        </p>
    </div>

    <div class="content-card" style="padding:32px; border-radius:18px;">
        <h3 style="margin-bottom:20px; font-size:18px; font-weight:600;">
            Informasi Personal
        </h3>

        <form id="form-profile">
            <input type="hidden" id="input-id">
            <input type="hidden" id="input-role">
            <input type="hidden" id="input-status">

            <div style="margin-bottom:20px;">
                <label style="font-size:13px; font-weight:600;">NUPTK (Nomor Induk)</label>
                <div class="input-control">
                    <input type="text" id="input-nuptk" style="background-color: #f3f4f6; cursor: not-allowed; width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;"
                        readonly>
                </div>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-size:13px; font-weight:600;">Username</label>
                <div class="input-control">
                    <input type="text" id="input-username" required style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                </div>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-size:13px; font-weight:600;">Password Baru (Opsional)</label>
                <div class="input-control" style="position: relative;">
                    <input type="password" id="input-password"
                        placeholder="Isi hanya jika ingin mengubah password" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                    <span id="btn-toggle-pass" style="cursor: pointer; position: absolute; right: 10px; top: 10px;">👁️</span>
                </div>
            </div>

            <p style="font-size:12px; color:var(--text-muted); margin-top:6px; text-align: right;">
                🕒 Terakhir diupdate: <span id="display-updated">-</span>
            </p>

            <button type="submit" style="
                margin-top:24px; padding:12px 24px;
                background: var(--primary); border:none;
                border-radius:10px; color:white;
                font-weight:600; cursor:pointer;
                float:right; box-shadow: 0 4px 12px rgba(255, 138, 92, 0.3);
                transition: 0.2s;
            " onmouseover="this.style.transform='translateY(-2px)'"
                onmouseout="this.style.transform='translateY(0)'">
                Simpan Perubahan
            </button>
        </form>

    </div>
</div>
