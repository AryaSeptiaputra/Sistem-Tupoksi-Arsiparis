<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Log Aktivitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        <a class="nav-item" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        
        <a class="nav-item active" data-route="/page/log" title="Log Aktivitas">📜</a>
        
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Log Aktivitas Sistem</h1>
                <p>Jejak audit (Audit Trail) untuk memantau keamanan dan tindakan pengguna</p>
            </div>
            <div class="header-tools">
                <div class="user-avatar">👨‍🏫</div>
            </div>
        </div>

        <section class="content-card">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Cari aktivitas (misal: 'menghapus', 'login')..." id="searchInput">
            </div>

            <div class="filter-row">
                <div class="filter-date-range">
                    <span>📅</span>
                    <input type="date" id="startDate" title="Tanggal Mulai" style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
                    <span style="margin: 0 4px;">-</span>
                    <input type="date" id="endDate" title="Tanggal Akhir" style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
                </div>

                <select id="filterUser" class="filter-select">
                    <option value="">Semua Pengguna</option>
                    </select>

                <button id="btnResetFilter" class="filter-btn" title="Reset filter">
                    🔄 Reset
                </button>

                <button class="btn-export" id="btnExport"><span>⬇️</span> Export CSV</button>
            </div>

            <div class="table-responsive">
                <table id="logsTable">
                    <thead>
                        <tr>
                            <th style="width: 200px;">Waktu (Timestamp)</th>
                            <th style="width: 180px;">Pengguna</th>
                            <th>Aktivitas</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/log.js') }}"></script>
</body>

</html>
