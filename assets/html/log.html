<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Log Aktivitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">S7</div>

        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        <a class="nav-item" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item active" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Log Aktivitas Sistem</h1>
                <p>Riwayat tindakan pengguna untuk audit dan keamanan</p>
            </div>
            <div class="header-tools">
                <div class="user-avatar">👨‍🏫</div>
            </div>
        </div>

        <section class="content-card">
            <div class="filter-row">
                <div style="flex: 1; min-width: 250px;">
                    <input type="text" class="search-input" placeholder="Cari aktivitas atau nama user..."
                        id="searchInput" style="margin:0; width: 100%;">
                </div>

                <div class="filter-date-range">
                    <span>📅</span>
                    <input type="date" id="dateStart"
                        style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
                    <span>-</span>
                    <input type="date" id="dateEnd"
                        style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
                </div>

                <button class="btn-export" onclick="loadLogs()">
                    <span>🔄</span> Refresh
                </button>
            </div>

            <div class="table-responsive">
                <table id="logsTable">
                    <thead>
                        <tr>
                            <th style="width: 200px;">Waktu (Timestamp)</th>
                            <th style="width: 200px;">Pengguna (User)</th>
                            <th>Aktivitas (Action)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="3" class="loading-text">Sedang memuat log...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("access_token");
            if (!token) { window.location.href = "/page/login"; return; }

            document.querySelectorAll("[data-route]").forEach(el => {
                el.addEventListener("click", () => { if (el.dataset.route) window.location.href = el.dataset.route; });
            });
            document.getElementById("btn-logout").addEventListener("click", () => {
                localStorage.removeItem("access_token"); window.location.href = "/page/login";
            });

            await loadLogs();

            document.getElementById('searchInput').addEventListener('keyup', filterTable);
        });

        async function loadLogs() {
            const tableBody = document.getElementById("table-body");
            tableBody.innerHTML = `<tr><td colspan="3" class="loading-text">Sedang memuat log...</td></tr>`;

            try {
                const data = await api.log.getAll();
                tableBody.innerHTML = "";

                if (!data || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" class="loading-text">Belum ada aktivitas tercatat.</td></tr>`;
                    return;
                }

                // Urutkan dari yang terbaru
                data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                data.forEach(item => {
                    const row = document.createElement("tr");

                    // 1. FORMAT WAKTU (Monospace Style)
                    const dateObj = new Date(item.timestamp);
                    // Format Tanggal: 03 Des 2025
                    const dateStr = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                    // Format Jam: 14:30:00
                    const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');

                    // 2. FORMAT USER (Bold & Link Style)
                    const userDisplay = item.username ? item.username : 'System';

                    // 3. FORMAT AKSI (Highlight Kata Kunci)
                    let actionHTML = item.action || '-';

                    // Mewarnai kata kunci tertentu agar mata mudah scanning
                    actionHTML = actionHTML
                        .replace(/menambahkan/gi, '<span style="color:#15803d; font-weight:600;">menambahkan</span>') // Hijau
                        .replace(/membuat/gi, '<span style="color:#15803d; font-weight:600;">membuat</span>') // Hijau
                        .replace(/mengupdate/gi, '<span style="color:#d97706; font-weight:600;">mengupdate</span>') // Kuning/Oranye
                        .replace(/memperbarui/gi, '<span style="color:#d97706; font-weight:600;">memperbarui</span>') // Kuning/Oranye
                        .replace(/menghapus/gi, '<span style="color:#dc2626; font-weight:600;">menghapus</span>') // Merah
                        .replace(/login/gi, '<span style="color:#2563eb; font-weight:600;">login</span>'); // Biru

                    row.innerHTML = `
                <td style="white-space:nowrap;">
                    <div class="timestamp-text">
                        <span>${dateStr}</span> • <span style="color:#1f2937; font-weight:600;">${timeStr}</span>
                    </div>
                </td>
                <td>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="background:#ffedd5; padding:4px 8px; border-radius:50%; font-size:12px;">👤</span>
                        <span class="user-link">${userDisplay}</span>
                    </div>
                </td>
                <td><div class="action-desc">${actionHTML}</div></td>
            `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="3" class="loading-text" style="color:red;">Gagal memuat log.</td></tr>`;
            }
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#table-body tr').forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(search) ? '' : 'none';
            });
        }
    </script>
</body>

</html>
