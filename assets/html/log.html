<div class="header-page">
    <div class="header-title">
        <h1>Log Aktivitas Sistem</h1>
        <p>Jejak audit (Audit Trail) untuk memantau keamanan dan tindakan pengguna.</p>
    </div>
</div>

<section class="content-card">
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Cari aktivitas (misal: 'menghapus', 'login')..."
            id="searchInput">
    </div>

    <div class="filter-row">
        <div class="filter-date-range">
            <span>📅</span>
            <input type="date" id="startDate" title="Tanggal Mulai"
                style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
            <span style="margin: 0 4px;">-</span>
            <input type="date" id="endDate" title="Tanggal Akhir"
                style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
        </div>

        <select id="filterUser" class="filter-select">
            <option value="">Semua Pengguna</option>
        </select>

        <button id="btnResetFilter" class="filter-btn" title="Reset filter" style="background:white; border:1px solid #e5e7eb; padding:8px 12px; border-radius:8px; cursor:pointer;">
            🔄 Reset
        </button>

        <button class="btn-export" id="btnExport"><span>⬇️</span> Export CSV</button>
    </div>

    <div class="table-responsive">
        <table id="logsTable">
            <thead>
                <tr>
                    <th style="width: 200px;">Waktu</th>
                    <th style="width: 300px;">Pengguna</th>
                    <th>Aktivitas</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>
</section>
