<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Surat Keluar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        thead tr {
            background-color: #b0ced6;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>

        <a class="nav-item active" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>

        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        <a class="nav-item" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup     Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Surat Keluar (Outgoing Mail)</h1>
                <p>Kelola surat keluar dengan mudah</p>
            </div>
            <div class="header-tools">
                <button class="btn-add">+</button>
                <div class="user-avatar">👨‍🏫</div>
            </div>
        </div>

        <section class="content-card">
            <div class="search-container"><input type="text" class="search-input" placeholder="Cari dokumen..."
                    id="searchInput"></div>
            <div class="filter-row">
                <div class="toggle-container" onclick="this.classList.toggle('active')">
                    <div class="toggle-switch"></div>
                    <span>Show SK (Decree) Only</span>
                </div>
            </div>
            <div class="table-responsive">
                <table id="outgoingTable">
                    <thead>
                        <tr>
                            <th>No Surat</th>
                            <th>Tanggal</th>
                            <th>Pengirim</th>
                            <th>Subjek</th>
                            <th style="text-align:center;">Keputusan</th>
                            <th style="text-align:center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Cek Login & Navigasi
            const token = localStorage.getItem("access_token");
            if (!token) { window.location.href = "/page/login"; return; }

            document.querySelectorAll("[data-route]").forEach(el => {
                el.addEventListener("click", () => { if (el.dataset.route) window.location.href = el.dataset.route; });
            });
            document.getElementById("btn-logout").addEventListener("click", () => {
                localStorage.removeItem("access_token"); window.location.href = "/page/login";
            });

            // 2. Load Data Surat Keluar
            await loadOutgoingLetters();

            // 3. Pencarian
            document.getElementById('searchInput').addEventListener('keyup', filterTable);
        });

        async function loadOutgoingLetters() {
            const tableBody = document.getElementById("table-body");
            tableBody.innerHTML = `<tr><td colspan="6" class="loading-text">Sedang memuat data...</td></tr>`;

            try {
                // Panggil API (Sesuai api.js: api.outgoingLetter.getAll())
                const data = await api.outgoingLetter.getAll();

                tableBody.innerHTML = "";
                if (!data || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="loading-text">Belum ada surat keluar.</td></tr>`;
                    return;
                }

                // Urutkan berdasarkan tanggal surat (terbaru diatas)
                data.sort((a, b) => new Date(b.letter_date) - new Date(a.letter_date));

                data.forEach(item => {
                    const row = document.createElement("tr");

                    // Format Tanggal
                    const options = { day: 'numeric', month: 'short', year: 'numeric' };
                    const dateLetter = item.letter_date ? new Date(item.letter_date).toLocaleDateString('id-ID', options) : '-';

                    // Logika Badge untuk SK (Decree)
                    let decreeBadge = '-';
                    if (item.is_decree) {
                        decreeBadge = `<span style="background:#dbeafe; color:#1e40af; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600;">SK / Keputusan</span>`;
                    }

                    row.innerHTML = `
                    <td style="font-weight: 500; font-family: 'Courier New';">${item.mail_number || '-'}</td>
                    <td>${dateLetter}</td>
                    <td>${item.destination || '-'}</td> 
                    <td>${item.subject || '-'}</td>
                    <td style="text-align:center;">${decreeBadge}</td>
                    <td style="text-align: center;">
                        <div class="btn-action-group">
                            <button class="btn-action-view" title="Lihat File">📄</button>
                            <button class="btn-action-view btn-edit" onclick="editLetter('${item.id}')">✏️</button>
                            <button class="btn-action-view btn-delete" onclick="deleteLetter('${item.id}')">🗑️</button>
                        </div>
                    </td>
                `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="6" class="loading-text" style="color:red;">Gagal memuat data.</td></tr>`;
            }
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            // Cek toggle SK Only (jika ada class active)
            const showSkOnly = document.querySelector('.toggle-container') ? document.querySelector('.toggle-container').classList.contains('active') : false;

            document.querySelectorAll('#table-body tr').forEach(row => {
                const text = row.innerText.toLowerCase();
                const isSK = row.innerHTML.includes('SK / Keputusan'); // Cara sederhana cek badge

                // Logika Gabungan: Match Search Text AND (Match SK Filter OR Filter is Off)
                const matchSearch = text.includes(search);
                const matchSK = showSkOnly ? isSK : true;

                row.style.display = (matchSearch && matchSK) ? '' : 'none';
            });
        }

        // Tambahkan event listener untuk toggle SK
        const toggleBtn = document.querySelector('.toggle-container');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function () {
                // Toggle class visual sudah ada di HTML (onclick="this.classList.toggle('active')")
                // Kita panggil filterTable() setelah delay sedikit agar class active terupdate
                setTimeout(filterTable, 50);
            });
        }

        function editLetter(id) { alert("Edit ID: " + id); }
        async function deleteLetter(id) {
            if (confirm("Hapus surat keluar ini?")) {
                try { await api.outgoingLetter.delete(id); loadOutgoingLetters(); }
                catch (e) { alert("Gagal hapus: " + e.message); }
            }
        }
    </script>
</body>

</html>
