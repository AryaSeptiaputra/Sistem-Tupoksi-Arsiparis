<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip Digital - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item active" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        <a class="nav-item" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="layout-dashboard">
        <section>
            <div class="header-page">
                <div class="header-title">
                    <h1 id="user-welcome">Selamat Datang!</h1>
                    <p>Kelola semua dokumen Anda dengan mudah.</p>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari dokumen..." />
            </div>

            <div class="filter-group">
                <button class="filter-btn active" onclick="filterDocs('all', this)">Semua</button>
                <button class="filter-btn" onclick="filterDocs('Surat Masuk', this)">📥 Surat Masuk</button>
                <button class="filter-btn" onclick="filterDocs('Surat Keluar', this)">📤 Surat Keluar</button>
                <button class="filter-btn" onclick="filterDocs('Ijazah', this)">🎓 Ijazah</button>
            </div>

            <h3 style="margin-bottom:12px;" id="list-title">Dokumen Terkini</h3>
            <div id="quick-access" class="docs-grid">
            </div>
        </section>

        <aside style="display:flex; flex-direction:column; gap:20px;">
            <div class="profile-card">
                <div style="display:flex;align-items:center;gap:14px;">
                    <div class="avatar-lg" id="dashboard-avatar" data-route="/page/user_profile"
                        style="cursor:pointer;">
                        ?
                    </div>
                    <div>
                        <h3 id="profile-name">Memuat...</h3>
                        <p id="profile-role" style="font-size:12px;margin:0;">—</p>
                    </div>
                </div>
            </div>
            <div class="content-card">
                <h4>Aktivitas Unggah</h4>
                <p><strong id="upload-count">0</strong> dokumen</p>
                <div id="upload-chart" class="mini-chart"></div>
            </div>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>

</html>
