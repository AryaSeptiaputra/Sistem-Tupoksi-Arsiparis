<div class="header-page">
    <div class="header-title">
        <h1>Data Ijazah Siswa</h1>
        <p>Kelola pendataan dan arsip digital ijazah lulusan.</p>
    </div>
    <div class="header-tools">
        <button class="btn-add" id="btn-add-new" title="Tambah Data Baru">+</button>
        <button class="btn-export hidden" id="btn-back-list" style="border:none; background: #e5e7eb;">↩
            Kembali</button>
    </div>
</div>

<section id="view-table" class="content-card">
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Cari Nama Siswa, NISN, atau No. Seri..."
            id="searchInput">
    </div>

    <div class="filter-row">
        <select id="filterMajor" class="filter-select">
            <option value="">Semua Jurusan</option>
            <option value="Kimia Industri">Kimia Industri</option>
            <option value="Teknik Penyempurnaan Tekstil">Teknik Penyempurnaan Tekstil</option>
            <option value="Analisis Kimia">Analisis Kimia</option>
            <option value="Farmasi">Farmasi</option>
            <option value="RPL">RPL</option>
            <option value="TKJ">TKJ</option>
        </select>

        <select id="filterYear" class="filter-select">
            <option value="">Semua Tahun</option>
            <option value="2024/2025">2024/2025</option>
            <option value="2023/2024">2023/2024</option>
            <option value="2022/2023">2022/2023</option>
        </select>

        <select id="filterStatus" class="filter-select">
            <option value="">Semua Status</option>
            <option value="taken">Sudah Diambil</option>
            <option value="pending">Belum Diambil</option>
        </select>
        <button id="btnResetFilter" class="filter-btn" style="background:white; border:1px solid #e5e7eb; padding:8px 12px; border-radius:8px; cursor:pointer;">🔄 Reset</button>
    </div>

    <div class="table-responsive">
        <table id="diplomaTable">
            <thead>
                <tr>
                    <th style="width: 25%;">Siswa & NISN</th>
                    <th style="width: 20%;">Jurusan & Tahun</th>
                    <th style="width: 25%;">Lokasi & Status</th>
                    <th style="width: 15%;">Tanggal Ambil</th>
                    <th style="width: 15%; text-align:center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</section>

<div id="view-form" class="layout-split hidden">
    <section class="card-form" style="background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; height: 100%; overflow: hidden;">
        <h3 id="form-title" style="font-size:16px; font-weight:600; margin-bottom:16px;">🎓 Input Data Siswa
        </h3>

        <form id="form-entry" style="flex: 1; overflow-y: auto; padding-right: 8px; margin-bottom: 16px;">
            <input type="hidden" id="entry-id">

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Nama Lengkap Siswa</label>
                <div class="input-control"><input id="student_name" required type="text"
                        placeholder="Nama sesuai ijazah" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;"></div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Nomor Seri Ijazah / NISN</label>
                <div class="input-control"><input id="serial_number" required type="text"
                        placeholder="Contoh: DN-01/Mk/12345" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Jurusan</label>
                    <select id="major" class="filter-select" style="width:100%" required>
                        <option value="">Pilih...</option>
                        <option value="RPL">Rekayasa Perangkat Lunak</option>
                        <option value="TKJ">Teknik Komputer Jaringan</option>
                        <option value="AKL">Akuntansi</option>
                        <option value="OTKP">Perkantoran</option>
                        <option value="Kimia Industri">Kimia Industri</option>
                        <option value="Teknik Penyempurnaan Tekstil">Teknik Penyempurnaan Tekstil</option>
                        <option value="Analisis Kimia">Analisis Kimia</option>
                        <option value="Farmasi">Farmasi</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Tahun Ajaran</label>
                    <div class="input-control">
                        <input id="academic_year" required type="text" placeholder="Contoh: 2024/2025"
                            style="width:100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Lokasi Simpan Fisik</label>
                <select id="storage_location_id" class="filter-select" style="width:100%">
                    <option value="">-- Pilih Lokasi --</option>
                </select>
                <p style="font-size:11px; color:var(--text-muted); margin-top:4px;">Lemari tempat ijazah
                    disimpan sebelum diambil.</p>
            </div>

            <div style="margin-top: 16px; padding: 12px; background: #f3f4f6; border-radius: 8px;">
                <label
                    style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; font-size:13px;">
                    <input type="checkbox" id="is_taken_checkbox"> Ijazah Sudah Diambil?
                </label>

                <div id="date-taken-wrapper" class="hidden" style="margin-top: 10px;">
                    <label style="font-size:12px;">Tanggal Pengambilan</label>
                    <input type="date" id="date_taken" class="filter-select" style="width:100%">
                </div>
            </div>
        </form>

        <div style="padding-top:16px; border-top:1px solid #f3f4f6;">
            <button id="btn-save-data"
                style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:600; cursor:pointer;">Simpan
                Data</button>
        </div>
    </section>

    <section class="card-preview" style="background: white; border-radius: 16px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column;">
        <div id="upload-box" class="upload-state" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #d1d5db; border-radius: 14px; margin: 16px; background: #f9fafb;">
            <div style="font-size:48px; margin-bottom:12px;">📄</div>
            <h3 style="font-size:14px; font-weight:600;">Upload Scan Ijazah</h3>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">PDF / Gambar (Max 5MB)</p>
            <label
                style="padding:8px 16px; background:var(--primary); color:white; border-radius:99px; font-size:12px; cursor:pointer;">
                Pilih File <input type="file" id="fileInput" accept="application/pdf, image/*"
                    style="display:none;">
            </label>
        </div>
        <div id="preview-box" class="preview-state" style="display: none; height: 100%; width: 100%; background: #525659; position: relative;">
            <button id="btn-cancel-upload" style="position: absolute; top: 16px; right: 16px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 10;">
                <span>✖</span> Ganti File
            </button>
            <iframe id="pdf-viewer" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </section>
</div>

<section id="view-pdf-fullscreen" class="content-card hidden"
    style="height: calc(100vh - 140px); display: flex; flex-direction: column; padding: 0;">
    <div
        style="padding: 16px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0; font-size: 16px;">📄 Pratinjau Dokumen</h3>
        <button id="btn-close-preview-mode"
            style="background: #e5e7eb; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">✖
            Tutup</button>
    </div>
    <div style="flex: 1; background: #525659; position: relative;">
        <iframe id="fullscreen-pdf-viewer" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</section>
