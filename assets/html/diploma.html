<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Data Ijazah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        
        <a class="nav-item active" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Data Ijazah Siswa</h1>
                <p>Kelola pengambilan dan pendataan ijazah lulusan</p>
            </div>
            <div class="header-tools">
                <button class="btn-add">+</button>
                <div class="user-avatar">👨‍🏫</div>
            </div>
        </div>

        <section class="content-card">
            <div class="search-container"><input type="text" class="search-input" placeholder="Cari..." id="searchInput"></div>
            <div class="table-responsive">
                <table id="diplomaTable">
                    <thead>
                        <tr>
                            <th>No. Seri Ijazah</th>
                            <th>Nama Siswa</th>
                            <th>Jurusan</th>
                            <th>Tahun Ajaran</th>
                            <th>Status</th>
                            <th>Tanggal Diambil</th>
                            <th style="text-align:center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                         </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!localStorage.getItem("access_token")) { window.location.href = "/page/login"; return; }
            document.querySelectorAll("[data-route]").forEach(el => {
                el.addEventListener("click", () => { if (el.dataset.route) window.location.href = el.dataset.route; });
            });
            document.getElementById("btn-logout").addEventListener("click", () => {
                localStorage.removeItem("access_token"); window.location.href = "/page/login";
            });
            await loadDiplomas();
        });

        async function loadDiplomas() {
            const tableBody = document.getElementById("table-body");
            tableBody.innerHTML = `<tr><td colspan="7" class="loading-text">Sedang memuat data...</td></tr>`;
            try {
                // Pastikan route 'diploma' sudah ada di api.js
                const data = await fetchAPI('/diploma/get_all', 'GET'); 
                tableBody.innerHTML = "";
                if (!data || data.length === 0) { tableBody.innerHTML = `<tr><td colspan="7" class="loading-text">Belum ada data.</td></tr>`; return; }
                
                data.forEach(item => {
                    const row = document.createElement("tr");
                    const statusBadge = item.is_collected ? `<span class="badge-taken">Sudah Diambil</span>` : `<span class="badge-pending">Belum Diambil</span>`;
                    row.innerHTML = `
                    <td style="font-weight: 500; font-family:'Courier New';">${item.number || '-'}</td>
                    <td style="font-weight:600; color:var(--text-main);">${item.student_name || '-'}</td>
                    <td>${item.major || '-'}</td>
                    <td>${item.academic_year || '-'}</td>
                    <td>${statusBadge}</td>
                    <td style="font-size:12px;">${item.collected_at || '-'}</td>
                    <td style="text-align:center;">
                        <div class="btn-action-group">
                            <button class="btn-action-view" title="Lihat Detail">👁️</button>
                        </div>
                    </td>
                `;
                    tableBody.appendChild(row);
                });
            } catch (error) { tableBody.innerHTML = `<tr><td colspan="7" class="loading-text" style="color:red;">Gagal memuat.</td></tr>`; }
        }
    </script>
</body>
</html>
