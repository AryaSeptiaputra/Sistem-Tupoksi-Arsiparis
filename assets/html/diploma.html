<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Data Ijazah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        
        <a class="nav-item active" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Data Ijazah Siswa</h1>
                <p>Kelola pendataan, status pengambilan, dan arsip ijazah lulusan</p>
            </div>
            <div class="header-tools">
                <button class="btn-add" title="Tambah Data Ijazah">+</button>
                <div class="user-avatar">👨‍🏫</div>
            </div>
        </div>

        <section class="content-card">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Cari Nama Siswa atau No. Seri..." id="searchInput">
            </div>

            <div class="filter-row">
                <select id="filterMajor" class="filter-select">
                    <option value="">Semua Jurusan</option>
                    </select>

                <select id="filterYear" class="filter-select">
                    <option value="">Semua Tahun Ajaran</option>
                    </select>

                <div class="toggle-container" id="toggleStatusContainer" title="Tampilkan yang belum diambil saja">
                    <div class="toggle-switch"></div>
                    <span>Belum Diambil</span>
                </div>

                <button id="btnResetFilter" class="filter-btn" title="Reset filter">
                    🔄
                </button>

                <button class="btn-export" id="btnExport"><span>⬇️</span> Export Data</button>
            </div>

            <div class="table-responsive">
                <table id="diplomaTable">
                    <thead>
                        <tr>
                            <th>No. Seri Ijazah</th>
                            <th>Nama Siswa</th>
                            <th>Jurusan</th>
                            <th>Thn. Ajaran</th>
                            <th>Status Pengambilan</th>
                            <th>Tgl Diambil</th>
                            <th style="text-align:center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/diploma.js') }}"></script>
</body>

</html>
