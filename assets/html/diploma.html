<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Data Ijazah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        /* --- CSS Tambahan untuk Split View (Sama seperti Surat Masuk/Keluar) --- */
        .layout-split { display: grid; grid-template-columns: 400px 1fr; gap: 24px; height: calc(100vh - 180px); min-height: 0; }
        .card-form { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .form-scroll-area { flex: 1; overflow-y: auto; padding-right: 8px; margin-bottom: 16px; }
        .form-scroll-area::-webkit-scrollbar { width: 6px; }
        .form-scroll-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        
        .card-preview { background: white; border-radius: 16px; box-shadow: 0 2px 15px rgba(0,0,0,0.03); height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        .upload-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #d1d5db; border-radius: 14px; margin: 16px; background: #f9fafb; transition: 0.2s; }
        .upload-state:hover { background: #f0f9ff; border-color: var(--primary); }
        
        .preview-state { display: none; height: 100%; width: 100%; background: #525659; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .btn-remove-file { position: absolute; top: 16px; right: 16px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; display: flex; align-items: center; gap: 6px; }
        
        .hidden { display: none !important; }

        /* Badge Status */
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .badge-success { background: #dcfce7; color: #166534; } /* Hijau */
        .badge-warning { background: #fef9c3; color: #854d0e; } /* Kuning/Orange */
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item active" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>
        <div style="margin-top:auto;"><a class="nav-item btn-logout-sidebar" id="btn-logout">🚪</a></div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Data Ijazah Siswa</h1>
                <p>Kelola pendataan dan arsip digital ijazah lulusan.</p>
            </div>
            <div class="header-tools">
                <button class="btn-add" id="btn-add-new" title="Tambah Data Baru">+</button>
                <button class="btn-export hidden" id="btn-back-list" style="border:none; background: #e5e7eb;">
                    ↩ Kembali
                </button>
                <div class="user-avatar" id="header-avatar">?</div>
            </div>
        </div>

        <section id="view-table" class="content-card">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Cari Nama Siswa, NISN, atau No. Seri..." id="searchInput">
            </div>

            <div class="filter-row">
                <select id="filterMajor" class="filter-select">
                    <option value="">Semua Jurusan</option>
                    <option value="Kimia Industri">Kimia Industri</option>
                    <option value="Teknik Penyempurnaan Tekstil">Teknik Penyempurnaan Tekstil</option>
                    <option value="Analisis Kimia ">Analisis Kimia</option>
                    <option value="Farmasi">Farmasi</option>
                </select>

                <select id="filterYear" class="filter-select">
                    <option value="">Semua Tahun</option>
                    <option value="2024/2025">2024/2025</option>
                    <option value="2023/2024">2023/2024</option>
                    <option value="2022/2023">2022/2023</option>
                </select>

                <select id="filterStatus" class="filter-select">
                    <option value="">Semua Status</option>
                    <option value="taken">Sudah Diambil</option>
                    <option value="pending">Belum Diambil</option>
                </select>

                <button id="btnResetFilter" class="filter-btn">🔄 Reset</button>
            </div>

            <div class="table-responsive">
                <table id="diplomaTable">
                    <thead>
                        <tr>
                            <th>No. Seri / NISN</th>
                            <th>Nama Siswa</th>
                            <th>Jurusan</th>
                            <th>Thn Ajaran</th>
                            <th>Status</th>
                            <th>Tgl Ambil</th>
                            <th style="text-align:center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
            </div>
        </section>

        <div id="view-form" class="layout-split hidden">
            <section class="card-form">
                <h3 id="form-title" style="font-size:16px; font-weight:600; margin-bottom:16px;">🎓 Input Data Siswa</h3>
                
                <form id="form-entry" class="form-scroll-area">
                    <input type="hidden" id="entry-id">
                    
                    <div class="form-group">
                        <label>Nama Lengkap Siswa</label>
                        <div class="input-control"><input id="student_name" required type="text" placeholder="Nama sesuai ijazah"></div>
                    </div>

                    <div class="form-group">
                        <label>Nomor Seri Ijazah / NISN</label>
                        <div class="input-control"><input id="serial_number" required type="text" placeholder="Contoh: DN-01/Mk/12345"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label>Jurusan</label>
                            <select id="major" class="filter-select" style="width:100%" required>
                                <option value="">Pilih...</option>
                                <option value="RPL">Rekayasa Perangkat Lunak</option>
                                <option value="TKJ">Teknik Komputer Jaringan</option>
                                <option value="AKL">Akuntansi</option>
                                <option value="OTKP">Perkantoran</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tahun Ajaran</label>
                            <select id="academic_year" class="filter-select" style="width:100%" required>
                                <option value="">Pilih...</option>
                                <option value="2024/2025">2024/2025</option>
                                <option value="2023/2024">2023/2024</option>
                                <option value="2022/2023">2022/2023</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top: 16px; padding: 12px; background: #f3f4f6; border-radius: 8px;">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; font-size:13px;">
                            <input type="checkbox" id="is_taken_checkbox"> Ijazah Sudah Diambil?
                        </label>
                        
                        <div id="date-taken-wrapper" class="hidden" style="margin-top: 10px;">
                            <label style="font-size:12px;">Tanggal Pengambilan</label>
                            <input type="date" id="date_taken" class="filter-select" style="width:100%">
                        </div>
                    </div>
                </form>

                <div style="padding-top:16px; border-top:1px solid #f3f4f6;">
                    <button id="btn-save-data" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:600; cursor:pointer;">Simpan Data</button>
                </div>
            </section>

            <section class="card-preview">
                <div id="upload-box" class="upload-state">
                    <div style="font-size:48px; margin-bottom:12px;">📄</div>
                    <h3 style="font-size:14px; font-weight:600;">Upload Scan Ijazah</h3>
                    <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">PDF / Gambar (Max 5MB)</p>
                    
                    <label style="padding:8px 16px; background:var(--primary); color:white; border-radius:99px; font-size:12px; cursor:pointer;">
                        Pilih File <input type="file" id="fileInput" accept="application/pdf, image/*" style="display:none;">
                    </label>
                </div>
                
                <div id="preview-box" class="preview-state">
                    <button class="btn-remove-file" id="btn-cancel-upload"><span>✖</span> Ganti File</button>
                    <iframe id="pdf-viewer" src=""></iframe>
                </div>
            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/diploma.js') }}"></script>
</body>
</html>
