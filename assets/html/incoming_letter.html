<div class="header-page">
    <div class="header-title">
        <h1>Surat Masuk</h1>
        <p>Kelola dokumen arsip surat masuk sekolah.</p>
    </div>
    <div class="header-tools">
        <button class="btn-add" id="btn-add-new" title="Tambah Data">+</button>
        <button class="btn-export hidden" id="btn-back-list" style="border:none; background: #e5e7eb;">↩ Kembali</button>
    </div>
</div>

<section id="view-table" class="content-card">
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Cari No Surat, Pengirim, atau Perihal..." id="searchInput">
    </div>

    <div class="filter-row" style="flex-wrap: wrap; gap: 8px;">
        
        <div class="filter-group-wrapper" style="display: flex; align-items: center; gap: 8px; background: white; padding: 4px 8px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <select id="filterDateType" class="filter-type-select" title="Pilih jenis tanggal untuk difilter" style="border: none; font-size: 12px; font-weight: 600; color: var(--primary); outline: none; background: transparent; cursor: pointer;">
                <option value="received">📅 Tgl Input (Sistem)</option>
                <option value="letter">📝 Tgl Surat (Kop)</option>
            </select>
            
            <div style="width: 1px; height: 16px; background: #e5e7eb; margin: 0 4px;"></div>
            
            <input type="date" id="startDate" class="filter-date-input" style="border: none; font-size: 13px; outline: none; width: 105px; color: #374151;">
            <span style="color:#9ca3af">-</span>
            <input type="date" id="endDate" class="filter-date-input" style="border: none; font-size: 13px; outline: none; width: 105px; color: #374151;">
        </div>

        <select id="filterClassification" class="filter-select" style="min-width: 140px;">
            <option value="">Semua Klasifikasi</option>
        </select>

        <select id="filterStatus" class="filter-select" style="min-width: 120px;">
            <option value="">Semua Status</option>
            <option value="active">🟢 Aktif</option>
            <option value="inactive">🟡 Inaktif</option>
            <option value="destroyed">🔴 Musnah</option>
        </select>

        <button id="btnResetFilter" class="filter-btn" style="background:white; border:1px solid #e5e7eb; padding:8px 12px; border-radius:8px; cursor:pointer;">🔄 Reset</button>
    </div>

    <div class="table-responsive">
        <table id="incomingTable">
            <thead>
                <tr>
                    <th style="width: 18%;">No & Tanggal Surat</th>
                    <th style="width: 15%;">Tanggal Masuk</th> 
                    <th style="width: 30%;">Pengirim & Perihal</th>
                    <th style="width: 12%;">Klasifikasi</th>
                    <th style="width: 15%;">Lokasi & Status</th>
                    <th style="width: 10%;">Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</section>

<div id="view-form" class="layout-split hidden">
    <section class="card-form" style="background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; height: 100%; overflow: hidden;">
        <h3 id="form-title" style="font-size:16px; font-weight:600; margin-bottom:16px;">📝 Tambah Surat</h3>
        <form id="form-entry" style="flex: 1; overflow-y: auto; padding-right: 8px; margin-bottom: 16px;">
            <input type="hidden" id="entry-id">
            
            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Nomor Surat</label>
                <div class="input-control">
                    <input id="number" required type="text" placeholder="Contoh: 421.5/001" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Pengirim</label>
                <div class="input-control">
                    <input id="sender" required type="text" placeholder="Contoh: Dinas Pendidikan" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                </div>
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Klasifikasi</label>
                    <select id="classification_id" class="filter-select" style="width:100%" required><option value="">Memuat...</option></select>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Lokasi Simpan</label>
                    <select id="storage_location_id" class="filter-select" style="width:100%"><option value="">-- Pilih Lokasi --</option></select>
                </div>
            </div>
            
            <div class="form-group hidden" id="group-archive-status" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Status Arsip</label>
                <select id="archive_status" class="filter-select" style="width:100%">
                    <option value="active">🟢 Aktif (Unit Kerja)</option>
                    <option value="inactive">🟡 Inaktif (Gudang)</option>
                    <option value="destroyed">🔴 Musnah</option>
                </select>
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Tgl Surat</label>
                    <input type="date" id="letter_date" required class="filter-select" style="width:100%">
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Tgl Diterima</label>
                    <input type="date" id="received_date" required class="filter-select" style="width:100%">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Perihal</label>
                <textarea id="subject" rows="4" class="input-control" placeholder="Ringkasan isi surat..." style="width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:8px; resize:none; font-family: inherit; font-size: 13px;"></textarea>
            </div>
        </form>
        
        <div style="padding-top:16px; border-top:1px solid #f3f4f6;">
            <button id="btn-save-data" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:600; cursor:pointer;">Simpan Data</button>
        </div>
    </section>
    
    <section class="card-preview" style="background: white; border-radius: 16px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column;">
        <div id="upload-box" class="upload-state" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #d1d5db; border-radius: 14px; margin: 16px; background: #f9fafb;">
            <div style="font-size:48px; margin-bottom:12px;">📄</div>
            <h3 style="font-size:14px; font-weight:600;">Upload Scan (PDF)</h3>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Max 5MB</p>
            <label style="padding:8px 16px; background:var(--primary); color:white; border-radius:99px; font-size:12px; cursor:pointer;">
                Pilih File <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
            </label>
        </div>
        <div id="preview-box" class="preview-state" style="display: none; height: 100%; width: 100%; background: #525659; position: relative;">
            <button id="btn-cancel-upload" style="position: absolute; top: 16px; right: 16px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 10;">
                <span>✖</span> Ganti File
            </button>
            <iframe id="pdf-viewer" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </section>
</div>

<section id="view-pdf-fullscreen" class="content-card hidden" style="height: calc(100vh - 140px); display: flex; flex-direction: column; padding: 0;">
    <div style="padding: 16px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0; font-size: 16px;">📄 Pratinjau Dokumen</h3>
        <button id="btn-close-preview-mode" style="background: #e5e7eb; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">✖ Tutup</button>
    </div>
    <div style="flex: 1; background: #525659; position: relative;">
        <iframe id="fullscreen-pdf-viewer" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</section>
