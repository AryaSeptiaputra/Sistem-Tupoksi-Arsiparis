<div class="header-page">
    <div class="header-title">
        <h1>Arsip Keuangan</h1>
        <p>Kelola dokumen SPJ, Laporan BOS, dan bukti transaksi.</p>
    </div>
    <div class="header-tools">
        <button class="btn-add" id="btn-add-new" title="Tambah Data">+</button>
        <button class="btn-export hidden" id="btn-back-list" style="background: #e5e7eb; border:none;">↩
            Kembali</button>
    </div>
</div>

<section id="view-table" class="content-card">
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Cari Judul, Keterangan, atau Kategori..."
            id="searchInput">
    </div>

    <div class="filter-row">
        <select id="filterYear" class="filter-select">
            <option value="">Semua Tahun</option>
        </select>
        <select id="filterMonth" class="filter-select">
            <option value="">Semua Bulan</option>
            <option value="1">Januari</option>
            <option value="2">Februari</option>
            <option value="3">Maret</option>
            <option value="4">April</option>
            <option value="5">Mei</option>
            <option value="6">Juni</option>
            <option value="7">Juli</option>
            <option value="8">Agustus</option>
            <option value="9">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
        </select>
        <select id="filterCategory" class="filter-select">
            <option value="">Semua Kategori</option>
            <option value="bos_reguler">BOS Reguler</option>
            <option value="bos_kinerja">BOS Kinerja</option>
            <option value="komite">Komite</option>
            <option value="bop">BOP</option>
        </select>
        <select id="filterStatus" class="filter-select">
            <option value="">Semua Status</option>
            <option value="active">🟢 Aktif</option>
            <option value="inactive">🟡 Inaktif</option>
            <option value="destroyed">🔴 Musnah</option>
        </select>
        <button id="btnResetFilter" class="filter-btn" style="background:white; border:1px solid #e5e7eb; padding:8px 12px; border-radius:8px; cursor:pointer;">🔄 Reset</button>
    </div>

    <div class="table-responsive">
        <table id="financeTable">
            <thead>
                <tr>
                    <th width="8%">Periode</th>
                    <th width="18%">Judul & Keterangan</th>
                    <th width="15%">Kategori</th>
                    <th width="15%">Nominal (Rp)</th>
                    <th width="13%">Klasifikasi</th>
                    <th width="15%">Lokasi & Status</th>
                    <th style="text-align:center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</section>

<div id="view-form" class="layout-split hidden">
    <section class="card-form" style="background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; height: 100%; overflow: hidden;">
        <h3 id="form-title" style="font-size:16px; font-weight:600; margin-bottom:16px;">📝 Tambah Arsip
            Keuangan</h3>

        <form id="form-entry" style="flex: 1; overflow-y: auto; padding-right: 8px; margin-bottom: 16px;">
            <input type="hidden" id="entry-id">

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Judul Dokumen <span>*</span></label>
                <div class="input-control">
                    <input id="title" required type="text" placeholder="Contoh: Laporan SPJ BOS Tahap 1" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Tahun Anggaran <span>*</span></label>
                    <div class="input-control">
                        <input type="number" id="fiscal_year" required placeholder="2024" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Bulan (Opsional)</label>
                    <div class="input-control">
                        <select id="period_month" class="filter-select" style="width:100%">
                            <option value="">-- Pilih --</option>
                            <option value="1">Januari</option>
                            <option value="2">Februari</option>
                            <option value="3">Maret</option>
                            <option value="4">April</option>
                            <option value="5">Mei</option>
                            <option value="6">Juni</option>
                            <option value="7">Juli</option>
                            <option value="8">Agustus</option>
                            <option value="9">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">Desember</option>
                        </select>
                    </div>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Kategori Dana</label>
                    <div class="input-control">
                        <select id="category" class="filter-select" style="width:100%">
                            <option value="bos_reguler">BOS Reguler</option>
                            <option value="bos_kinerja">BOS Kinerja</option>
                            <option value="komite">Dana Komite</option>
                            <option value="bop">BOP</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Nominal (Rp)</label>
                    <div class="input-control">
                        <input type="number" id="amount" placeholder="0" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                    </div>
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Klasifikasi</label>
                    <div class="input-control">
                        <select id="classification_id" class="filter-select" style="width:100%" required>
                            <option value="">Memuat...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Lokasi Simpan</label>
                    <div class="input-control">
                        <select id="storage_location_id" class="filter-select" style="width:100%">
                            <option value="">-- Pilih Lokasi --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group hidden" id="group-archive-status" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Status Arsip</label>
                <select id="archive_status" class="filter-select" style="width:100%">
                    <option value="active">🟢 Aktif (Unit Kerja)</option>
                    <option value="inactive">🟡 Inaktif (Gudang)</option>
                    <option value="destroyed">🔴 Musnah</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Keterangan Tambahan</label>
                <div class="input-control">
                    <textarea id="description" rows="3" placeholder="Catatan detail..." style="width:100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; resize:none; font-family: inherit; font-size: 13px;"></textarea>
                </div>
            </div>
        </form>

        <div style="padding-top:16px; border-top:1px solid #f3f4f6;">
            <button id="btn-save-data"
                style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:600; cursor:pointer;">Simpan
                Data</button>
        </div>
    </section>

    <section class="card-preview" style="background: white; border-radius: 16px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column;">
        <div id="upload-box" class="upload-state" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #d1d5db; border-radius: 14px; margin: 16px; background: #f9fafb;">
            <div style="font-size:48px; margin-bottom:12px;">💰</div>
            <h3 style="font-size:14px; font-weight:600;">Upload Bukti (PDF)</h3>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Max 10MB</p>
            <label
                style="padding:8px 16px; background:var(--primary); color:white; border-radius:99px; font-size:12px; cursor:pointer;">
                Pilih File <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
            </label>
        </div>
        <div id="preview-box" class="preview-state" style="display: none; height: 100%; width: 100%; background: #525659; position: relative;">
            <button id="btn-cancel-upload" style="position: absolute; top: 16px; right: 16px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 10;">
                <span>✖</span> Ganti File
            </button>
            <iframe id="pdf-viewer" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </section>
</div>

<section id="view-pdf-fullscreen" class="content-card hidden"
    style="height: calc(100vh - 140px); display: flex; flex-direction: column; padding: 0;">
    <div
        style="padding: 16px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0; font-size: 16px;">📄 Pratinjau Dokumen</h3>
        <button id="btn-close-preview-mode"
            style="background: #e5e7eb; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">✖
            Tutup</button>
    </div>
    <div style="flex: 1; background: #525659; position: relative;">
        <iframe id="fullscreen-pdf-viewer" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</section>
