<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Data Klasifikasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>

        <a class="nav-item active" data-route="/page/classification" title="Klasifikasi">🏷️</a>

        <a class="nav-item" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Data Klasifikasi</h1>
                <p>Kelola kode referensi untuk pengarsipan surat</p>
            </div>
            <div class="header-tools">
                <button class="btn-add" title="Tambah Klasifikasi" onclick="window.location.href='/page/classification/create'">+</button>
                <div class="user-avatar" id="header-avatar">?</div>
            </div>
        </div>

        <section class="content-card">
            <div class="filter-row" style="justify-content: space-between;">
                <div class="search-container" style="margin-bottom: 0; width: 400px;">
                    <input type="text" class="search-input" placeholder="Cari Kode atau Nama Klasifikasi..."
                        id="searchInput">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button id="btnResetFilter" class="filter-btn" title="Reset pencarian">
                        🔄 Reset
                    </button>
                    </div>
            </div>

            <div class="table-responsive">
                <table id="classificationTable">
                    <thead>
                        <tr>
                            <th width="15%">Kode</th>
                            <th width="30%">Nama Klasifikasi</th>
                            <th>Deskripsi</th>
                            <th width="15%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/classification.js') }}"></script>
</body>

</html>
