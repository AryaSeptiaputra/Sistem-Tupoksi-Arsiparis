<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Backup Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        <a class="nav-item" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        <a class="nav-item" data-route="/page/user" title="Pengguna">👥</a>
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        
        <a class="nav-item active" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        
        <div class="header-page">
            <div class="header-title">
                <h1>Backup & Restore</h1>
                <p>Kelola cadangan data untuk keamanan sistem arsip</p>
            </div>
            <div class="header-tools">
                <div class="user-avatar">👨‍🏫</div>
            </div>
        </div>

        <section class="content-card">
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <div>
                    <h3 style="margin:0; font-size:16px; font-weight:600;">Riwayat Cadangan</h3>
                    <p style="margin:0; font-size:13px; color:var(--text-muted);">List file backup yang tersimpan di server</p>
                </div>
                <button class="btn-backup-now" id="btnTriggerBackup">
                    <span>⚡</span> Backup Sekarang
                </button>
            </div>

            <hr style="border: 0; border-top: 1px solid #f3f4f6; margin-bottom: 24px;">

            <div class="search-container">
                <input type="text" class="search-input" placeholder="Cari nama file backup..." id="searchInput">
            </div>

            <div class="filter-row">
                <div class="filter-date-range">
                    <span>📅</span>
                    <input type="date" id="startDate" style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
                    <span style="margin:0 4px;">-</span>
                    <input type="date" id="endDate" style="border:none; outline:none; font-family:inherit; font-size:13px; color:var(--text-muted);">
                </div>

                <select id="filterStatus" class="filter-select">
                    <option value="">Semua Status</option>
                    <option value="success">Success (Berhasil)</option>
                    <option value="failed">Failed (Gagal)</option>
                </select>

                <select id="filterInitiator" class="filter-select">
                    <option value="">Semua Inisiator</option>
                    <option value="SYSTEM">SYSTEM (Auto)</option>
                    </select>

                <button id="btnResetFilter" class="filter-btn" title="Reset Filter">🔄</button>
            </div>

            <div class="table-responsive">
                <table id="backupTable">
                    <thead>
                        <tr>
                            <th>Nama File</th>
                            <th>Waktu Dibuat</th>
                            <th>Status</th>
                            <th>Dibuat Oleh</th>
                            <th style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/backup.js') }}"></script>
</body>
</html>
