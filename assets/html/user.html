<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip - Data Pengguna</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">S7</div>
        <a class="nav-item" data-route="/page/dashboard" title="Dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</a>
        <a class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</a>
        <a class="nav-item" data-route="/page/classification" title="Klasifikasi">🏷️</a>
        <a class="nav-item" data-route="/page/diploma" title="Data Ijazah">🎓</a>
        
        <a class="nav-item active" data-route="/page/user" title="Pengguna">👥</a>
        
        <a class="nav-item" data-route="/page/log" title="Log Aktivitas">📜</a>
        <a class="nav-item" data-route="/page/backup" title="Backup Database">💾</a>

        <div style="margin-top: auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout" title="Logout">🚪</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-page">
            <div class="header-title">
                <h1>Data Pengguna (Users)</h1>
                <p>Kelola akun akses untuk Guru, Tata Usaha, dan Kepala Sekolah</p>
            </div>
            <div class="header-tools">
                <button class="btn-add" title="Tambah Pengguna Baru" onclick="addUser()">+</button>
                <div class="user-avatar">👨‍🏫</div>
            </div>
        </div>

        <section class="content-card">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Cari NUPTK atau Username..." id="searchInput">
            </div>

            <div class="filter-row">
                <select class="filter-select" id="filterRole">
                    <option value="">Semua Role / Jabatan</option>
                    <option value="headmaster">Kepala Sekolah (Headmaster)</option>
                    <option value="admin">Tata Usaha (Admin)</option>
                    <option value="teacher">Guru (Teacher)</option>
                </select>

                <select class="filter-select" id="filterStatus">
                    <option value="">Semua Status</option>
                    <option value="active">Active (Aktif)</option>
                    <option value="inactive">Inactive (Nonaktif)</option>
                </select>

                <select class="filter-select" id="filterSort">
                    <option value="newest">Terbaru Ditambahkan</option>
                    <option value="name_asc">Nama (A - Z)</option>
                    <option value="name_desc">Nama (Z - A)</option>
                </select>

                <button id="btnResetFilter" class="filter-btn" title="Reset semua filter">
                    🔄
                </button>

                <button class="btn-export" id="btnExport"><span>⬇️</span> Export CSV</button>
            </div>

            <div class="table-responsive">
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>NUPTK</th>
                            <th>Username / Nama</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Tanggal Bergabung</th>
                            <th style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/user.js') }}"></script>
</body>

</html>
