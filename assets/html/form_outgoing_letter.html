<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Surat Keluar</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">S7</div>

        <a class="nav-item" data-route="/page/dashboard">🏠</a>
        <a class="nav-item" data-route="/page/incoming_letter">📥</a>
        <a class="nav-item active" data-route="/page/outgoing_letter">📤</a>
        <a class="nav-item" data-route="/page/classification">🏷️</a>
        <a class="nav-item" data-route="/page/diploma">🎓</a>
        <a class="nav-item" data-route="/page/user">👥</a>
        <a class="nav-item" data-route="/page/log">📜</a>
        <a class="nav-item" data-route="/page/backup">💾</a>

        <div style="margin-top:auto;">
            <a class="nav-item btn-logout-sidebar" id="btn-logout">🚪</a>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <div class="header-page">
            <div class="header-title">
                <h1>Input Surat Keluar</h1>
                <p>Unggah & isi detail surat keluar</p>
            </div>
        </div>

        <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:24px;">

            <!-- LEFT -->
            <section class="content-card" style="padding:28px;">
                <div style="border:2px dashed #d1d5db; padding:30px; border-radius:14px; text-align:center;">
                    <div style="font-size:36px; opacity:0.5;">⤴️</div>
                    <h3>Upload Scan Surat (PDF)</h3>
                    <p style="color:var(--text-muted); margin-top:4px;">Klik untuk memilih file</p>

                    <label style="display:inline-block; margin-top:14px; padding:10px 18px;
                    border:1px solid var(--border-color); border-radius:10px; cursor:pointer;">
                        Pilih File
                        <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
                    </label>
                </div>

                <h3 style="margin-top:24px;">Detail Surat</h3>

                <div class="form-group">
                    <label>Nomor Surat</label>
                    <div class="input-control"><input id="number" type="text" placeholder="Masukkan nomor surat"></div>
                </div>

                <div class="form-group">
                    <label>Klasifikasi Surat</label>
                    <div class="input-control"><input id="classification" type="text" placeholder="Masukkan klasifikasi"></div>
                </div>

                <div class="form-group">
                    <label>Tanggal Surat</label>
                    <input type="date" class="filter-select">
                </div>

                <div class="form-group">
                    <label>Tanggal Dikirim</label>
                    <input type="date" class="filter-select">
                </div>

                <div class="form-group">
                    <label>Tujuan / Instansi</label>
                    <div class="input-control"><input id="destination" type="text" placeholder="Masukkan tujuan"></div>
                </div>

                <div class="form-group">
                    <label>Perihal / Ringkasan</label>
                    <textarea id="subject" class="input-control" placeholder="Tuliskan ringkasan"></textarea>
                </div>

                <div style="display:flex; justify-content:space-between; margin-top:24px;">
                    <button style="background:none; border:none; cursor:pointer; color:var(--text-muted);">← Kembali</button>

                    <button style="padding:10px 18px; background:var(--primary); color:white;
                    border-radius:10px; border:none; cursor:pointer;">
                        Simpan
                    </button>
                </div>
            </section>

            <!-- RIGHT -->
            <section class="content-card" style="padding:24px;">
                <h3>Document Preview</h3>

                <div id="previewBox" style="
                    border:2px dashed #d1d5db;
                    margin-top:12px;
                    height:450px;
                    border-radius:14px;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    flex-direction:column;
                    color:var(--text-muted);
                ">
                    <div style="font-size:40px; opacity:0.5;">📄</div>
                    <p>Upload dokumen untuk preview</p>
                </div>
            </section>

        </div>
    </main>

    <script>
        // Route handling
        document.querySelectorAll("[data-route]").forEach(el => {
            el.addEventListener("click", () => window.location.href = el.dataset.route);
        });

        // PDF preview handling
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("previewBox");

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            preview.innerHTML = `<iframe src="${url}" style="width:100%; height:100%; border:none;"></iframe>`;
        });
    </script>

</body>

</html>
