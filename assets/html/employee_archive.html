<div class="header-page">
    <div class="header-title">
        <h1>Arsip Kepegawaian</h1>
        <p>Bank data dokumen Guru & Tenaga Kependidikan (SK, Sertifikat, Ijazah).</p>
    </div>
    <div class="header-tools">
        <button class="btn-add" id="btn-add-new" title="Tambah Data">+</button>
        <button class="btn-export hidden" id="btn-back-list" style="background: #e5e7eb; border:none;">↩
            Kembali</button>
    </div>
</div>

<section id="view-table" class="content-card">
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Cari Nama Dokumen atau Nama Guru..."
            id="searchInput">
    </div>

    <div class="filter-row">
        <select id="filterType" class="filter-select">
            <option value="">Semua Jenis Dokumen</option>
            <option value="sk_cpns">SK CPNS/PNS</option>
            <option value="sk_pangkat">SK Pangkat</option>
            <option value="sk_berkala">SK Berkala</option>
            <option value="sertifikat">Sertifikat</option>
            <option value="ijazah">Ijazah</option>
            <option value="ktp_kk">KTP / KK</option>
        </select>
        <select id="filterEmployee" class="filter-select">
            <option value="">Semua Pegawai</option>
        </select>
        <button id="btnResetFilter" class="filter-btn" style="background:white; border:1px solid #e5e7eb; padding:8px 12px; border-radius:8px; cursor:pointer;">🔄 Reset</button>
    </div>

    <div class="table-responsive">
        <table id="employeeTable">
            <thead>
                <tr>
                    <th width="35%">Nama Dokumen & Tahun</th>
                    <th width="20%">Jenis</th>
                    <th width="20%">Pemilik (Guru)</th>
                    <th width="15%">Lokasi Fisik</th>
                    <th style="text-align:center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</section>

<div id="view-form" class="layout-split hidden">
    <section class="card-form" style="background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; height: 100%; overflow: hidden;">
        <h3 id="form-title" style="font-size:16px; font-weight:600; margin-bottom:16px;">📝 Tambah Dokumen
            Pegawai</h3>

        <form id="form-entry" style="flex: 1; overflow-y: auto; padding-right: 8px; margin-bottom: 16px;">
            <input type="hidden" id="entry-id">

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Nama Dokumen <span>*</span></label>
                <div class="input-control">
                    <input id="document_name" required type="text"
                        placeholder="Contoh: SK Kenaikan Pangkat III/a" style="width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Pemilik Dokumen (Guru) <span>*</span></label>
                <div class="input-control">
                    <select id="owner_id" class="filter-select" style="width:100%" required>
                        <option value="">-- Pilih Guru / Pegawai --</option>
                    </select>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Jenis Dokumen</label>
                    <div class="input-control">
                        <select id="document_type" class="filter-select" style="width:100%">
                            <option value="lainnya">Lainnya</option>
                            <option value="sk_cpns">SK CPNS/PNS</option>
                            <option value="sk_pangkat">SK Kenaikan Pangkat</option>
                            <option value="sk_berkala">SK Berkala</option>
                            <option value="sertifikat">Sertifikat / Piagam</option>
                            <option value="ijazah">Ijazah Terakhir</option>
                            <option value="ktp_kk">KTP / KK</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Tahun Terbit</label>
                    <div class="input-control">
                        <input type="number" id="document_year" style="width:100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;" placeholder="2024">
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Lokasi Simpan Fisik</label>
                <div class="input-control">
                    <select id="storage_location_id" class="filter-select" style="width:100%">
                        <option value="">-- Pilih Lokasi --</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Keterangan</label>
                <div class="input-control">
                    <textarea id="description" rows="3" placeholder="Catatan tambahan..."
                        style="width:100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; resize:none; font-family: inherit; font-size: 13px;"></textarea>
                </div>
            </div>
        </form>

        <div style="padding-top:16px; border-top:1px solid #f3f4f6;">
            <button id="btn-save-data"
                style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:600; cursor:pointer;">Simpan
                Dokumen</button>
        </div>
    </section>

    <section class="card-preview" style="background: white; border-radius: 16px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03); height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column;">
        <div id="upload-box" class="upload-state" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #d1d5db; border-radius: 14px; margin: 16px; background: #f9fafb;">
            <div style="font-size:48px; margin-bottom:12px;">👤</div>
            <h3 style="font-size:14px; font-weight:600;">Upload Scan (PDF)</h3>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Max 5MB</p>
            <label
                style="padding:8px 16px; background:var(--primary); color:white; border-radius:99px; font-size:12px; cursor:pointer;">
                Pilih File <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
            </label>
        </div>
        <div id="preview-box" class="preview-state" style="display: none; height: 100%; width: 100%; background: #525659; position: relative;">
            <button id="btn-cancel-upload" style="position: absolute; top: 16px; right: 16px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 10;">
                <span>✖</span> Ganti File
            </button>
            <iframe id="pdf-viewer" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </section>
</div>

<section id="view-pdf-fullscreen" class="content-card hidden"
    style="height: calc(100vh - 140px); display: flex; flex-direction: column; padding: 0;">
    <div
        style="padding: 16px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0; font-size: 16px;">📄 Pratinjau Dokumen</h3>
        <button id="btn-close-preview-mode"
            style="background: #e5e7eb; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">✖
            Tutup</button>
    </div>
    <div style="flex: 1; background: #525659; position: relative;">
        <iframe id="fullscreen-pdf-viewer" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</section>
