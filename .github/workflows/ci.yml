name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Python 3.8 = versi yang dipakai klien di Windows 7; dipasang lewat uv
    # karena runner Ubuntu terbaru tidak lagi menyediakan 3.8.
    - name: Set up uv and Python 3.8
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.8'
        activate-environment: true

    - name: Install dependencies
      run: uv pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest tests
