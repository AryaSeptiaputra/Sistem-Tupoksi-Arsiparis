<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip Digital - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-main: #f5f7fb;
            --card-bg: #ffffff;
            --primary: #ff8a5c;
            --primary-dark: #ff6b3d;
            --accent: #27b4b7;
            --text-main: #1f2933;
            --text-muted: #6b7280;
            --radius-lg: 28px;
            --shadow-soft: 0 20px 40px rgba(15, 23, 42, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top left, #fef3f0 0, #f3f6ff 40%, #eef4ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 1080px;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: var(--shadow-soft);
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            overflow: hidden;
        }

        .auth-visual {
            background: linear-gradient(135deg, #fef3f0, #e0f2ff);
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 24px;
        }

        .illustration-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 24px;
            overflow: hidden;
            background: radial-gradient(circle at 20% 0, #ffd1b2, #fef5f1 40%, #e4f1ff 100%);
            position: relative;
        }

        .floating-items {
            position: absolute;
            inset: 15%;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: center;
        }

        .float-pill {
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }

        .float-icon {
            width: 54px;
            height: 54px;
            border-radius: 18px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.15);
            font-size: 26px;
        }

        .auth-visual h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-main);
        }

        .auth-visual p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 360px;
            line-height: 1.6;
        }

        .auth-form {
            padding: 46px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 26px;
        }

        .auth-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }

        .auth-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #e0f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #0d6efd;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #111827;
        }

        .input-control {
            position: relative;
        }

        .input-control input {
            width: 100%;
            padding: 12px 14px;
            padding-right: 42px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            outline: none;
            font-size: 13px;
            transition: 0.2s ease;
            background: #f9fafb;
        }

        .input-control input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 138, 92, 0.12);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #9ca3af;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            border: none;
            outline: none;
            margin-top: 6px;
            padding: 12px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 16px 30px rgba(248, 113, 72, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 34px rgba(248, 113, 72, 0.45);
        }

        .school-footer {
            margin-top: 14px;
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
        }

        @media (max-width: 900px) {
            .auth-wrapper {
                grid-template-columns: 1fr;
                max-width: 520px;
            }
            .auth-visual { display: none; }
            .auth-form { padding: 32px 24px 26px; }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- LEFT -->
        <div class="auth-visual">
            <div class="illustration-box">
                <div class="floating-items">
                    <div class="float-icon">📘</div>
                    <div class="float-icon">✉️</div>
                    <div class="float-pill">RPP & Dokumen Guru</div>
                    <div class="float-pill">Surat Masuk & Keluar</div>
                    <div class="float-pill">Laporan Kegiatan</div>
                    <div class="float-icon">📄</div>
                </div>
            </div>

            <div>
                <h1>Sistem Arsip Digital SMKN 7 Bandung</h1>
                <p>Mengelola dokumen dan arsip sekolah dengan mudah, aman, dan terorganisir.</p>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="auth-form">
            <div class="auth-header">
                <div class="auth-icon">🏫</div>
                <div>
                    <div class="auth-title">Sistem Arsip Digital</div>
                    <div class="auth-subtitle">
                        Selamat datang! Silakan login untuk melanjutkan.
                    </div>
                </div>
            </div>

            <form id="login-form"> <div class="form-group">
                    <label for="nuptk">NUPTK</label> <div class="input-control">
                        <input
                            type="text"
                            id="nuptk" 
                            name="nuptk"
                            placeholder="Masukkan NUPTK Anda"
                            autocomplete="username"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-control">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password Anda"
                            autocomplete="current-password"
                            required
                        />
                        <span class="toggle-password" id="toggle-password">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn-login">Login</button>

                <div class="school-footer">
                    © 2025 SMKN 7 Bandung. Sistem Arsip Digital.
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

    <script>
        const pwdInput = document.getElementById('password');
        const toggle = document.getElementById('toggle-password');
        if (toggle && pwdInput) {
            toggle.addEventListener('click', () => {
                const isPwd = pwdInput.type === 'password';
                pwdInput.type = isPwd ? 'text' : 'password';
            });
        }
    </script>
</body>
</html>
