<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip Digital - Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-page: #f5f7fb;
            --primary: #ff8a5c;
            --primary-soft: #ffe0d0;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            font-family: "Poppins", sans-serif;
            background: var(--bg-page);
        }

        .sidebar {
            width: 78px;
            background: white;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid #e5e7eb;
        }

        .sidebar-logo {
            width: 42px;
            height: 42px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff8a5c, #ff6b3d);
            color: white;
            font-weight: 700;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item {
            width: 44px;
            height: 44px;
            margin-top: 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #9ca3af;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .nav-item:hover {
            background: #f3f4ff;
        }

        .layout-main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.6fr 340px;
            padding: 24px;
            gap: 24px;
        }

        .page-header h1 {
            font-size: 24px;
            margin: 0;
        }

        .page-header p {
            font-size: 13px;
            margin-top: 4px;
            color: var(--text-muted);
        }

        .search-bar {
            position: relative;
            margin-top: 16px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 14px 12px 38px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
        }

        .search-bar span {
            position: absolute;
            top: 50%;
            left: 14px;
            font-size: 18px;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .quick-access {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .doc-card {
            display: flex;
            gap: 12px;
            background: white;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: 0.2s;
        }

        .doc-card:hover {
            transform: translateY(-2px);
        }

        .doc-icon { font-size: 30px; }

        .doc-chip {
            background: #e0f2fe;
            color: #0284c7;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 10px;
        }

        .doc-title { font-size: 14px; font-weight: 600; }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-card {
            background: #ff8a5c;
            color: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .avatar-lg {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: white;
            color: #fb923c;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-chart {
            height: 90px;
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }

        .bar {
            flex: 1;
            border-radius: 999px;
            background: linear-gradient(180deg, #ff8a5c, #fb923c);
        }

        .logout-btn {
            margin-top: auto;
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            background: #fff;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-logo">S7</div>

        <div class="nav-item active" data-route="/page/dashboard" title="Dashboard">🏠</div>
        <div class="nav-item" data-route="/page/incoming_letter" title="Surat Masuk">📥</div>
        <div class="nav-item" data-route="/page/outgoing_letter" title="Surat Keluar">📤</div>
        <div class="nav-item" data-route="/page/diploma" title="Ijazah/Rapor">📊</div>

        <button class="logout-btn" id="btn-logout">Logout</button>
    </aside>

    <main class="layout-main">
        <section>
            <div class="page-header">
                <h1 id="user-welcome">Selamat Datang!</h1>
                <p>Kelola semua dokumen Anda dengan mudah.</p>
            </div>

            <div class="search-bar">
                <span>🔍</span>
                <input type="text" placeholder="Cari dokumen..." />
            </div>

            <h3 style="margin-top:24px;">Akses Cepat</h3>

            <div id="quick-access" class="quick-access">
                </div>

            <button 
                data-route="/page/incoming_letter"
                style="margin-top:20px;padding:10px 18px;border:none;background:#ff8a5c;color:white;border-radius:999px;font-size:13px;cursor:pointer;">
                + Tambah Surat Masuk
            </button>

        </section>

        <aside class="right-panel">
            <div class="profile-card">
                <div style="display:flex;align-items:center;gap:14px;">
                    <div class="avatar-lg">👩‍🏫</div>
                    <div>
                        <h3 id="profile-name">Memuat...</h3>
                        <p id="profile-role" style="font-size:12px;margin:0;">—</p>
                    </div>
                </div>
            </div>

            <div class="card" style="background:white;border-radius:20px;padding:20px;">
                <h4>Aktivitas Unggah Bulan Ini</h4>
                <p><strong id="upload-count">0</strong> dokumen diunggah
                    <span id="upload-growth" style="font-size:11px;color:#16a34a;margin-left:6px;">0%</span>
                </p>

                <div id="upload-chart" class="mini-chart"></div>
            </div>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    <script>
        // Menangani klik pada elemen dengan atribut data-route
        document.querySelectorAll("[data-route]").forEach(el => {
            el.addEventListener("click", () => {
                const r = el.dataset.route;
                if (r) window.location.href = r;
            });
        });

        // Menangani Logout
        const btnLogout = document.getElementById("btn-logout");
        if (btnLogout) {
            btnLogout.addEventListener("click", () => {
                localStorage.removeItem("access_token");
                localStorage.removeItem("auth_user");
                // Redirect ke halaman login view
                window.location.href = "/page/login";
            });
        }
    </script>

</body>
</html>
